<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla Cupcakes · persistent video upload & download</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #fff7f0 0%, #fae9dd 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 680px;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2.5rem 2.2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2),
                  0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      transition: all 0.2s;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #4b2e1d;
      margin-bottom: 0.35rem;
    }

    h1 span {
      font-size: 2.5rem;
      line-height: 1;
    }

    .subhead {
      color: #7b5e4b;
      font-size: 1.05rem;
      margin-bottom: 2rem;
      font-weight: 400;
      border-left: 4px solid #d9b8a4;
      padding-left: 1rem;
    }

    .storage-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #e6f0e6;
      color: #2d5a2d;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      margin-top: 0.6rem;
      border: 1px solid #b8d4b8;
    }

    .storage-indicator.saving {
      background: #fff3d6;
      color: #8a6d1f;
      border-color: #e6d29c;
    }

    .storage-indicator.error {
      background: #ffede3;
      color: #9b4b2b;
      border-color: #e6b8a3;
    }

    .drop-area {
      border: 2.5px dashed #d9b8a4;
      border-radius: 2rem;
      background: #fffaf5;
      padding: 2rem 1.5rem;
      text-align: center;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
      margin-bottom: 1.8rem;
    }

    .drop-area.dragover {
      background: #f8ede4;
      border-color: #b28b74;
    }

    .drop-area input[type="file"] {
      display: none;
    }

    .drop-icon {
      font-size: 3.2rem;
      margin-bottom: 0.5rem;
      display: block;
      filter: drop-shadow(0 6px 8px rgba(185, 130, 90, 0.2));
    }

    .drop-text {
      font-weight: 500;
      color: #4b2e1d;
      font-size: 1.2rem;
      margin-bottom: 0.25rem;
    }

    .drop-hint {
      font-size: 0.9rem;
      color: #a18472;
    }

    .browse-btn {
      background: #d9b8a4;
      color: #2e1e14;
      border: none;
      padding: 0.6rem 1.6rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 0.9rem;
      display: inline-block;
      transition: background 0.15s, transform 0.1s;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(185, 130, 90, 0.2);
    }

    .browse-btn:hover {
      background: #c9a58e;
    }

    .browse-btn:active {
      transform: scale(0.96);
    }

    .file-info {
      background: #f5ede7;
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      border: 1px solid #e6d6cb;
    }

    .file-meta {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      overflow: hidden;
      flex: 1;
    }

    .file-name {
      font-weight: 600;
      color: #3c2a1e;
      word-break: break-word;
    }

    .file-size {
      font-size: 0.85rem;
      color: #7b5e4b;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      background: #c9a58e;
      color: #1f140e;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .badge.persisted {
      background: #5f8b5f;
      color: #fff;
    }

    .remove-btn {
      background: transparent;
      border: 1.5px solid #b28b74;
      color: #7b4e33;
      padding: 0.45rem 1.1rem;
      border-radius: 2.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .remove-btn:hover {
      background: #f0dfd4;
      border-color: #9b735b;
      color: #4b2e1d;
    }

    .validation-message {
      background: #ffede3;
      border-left: 6px solid #c97b5a;
      color: #9b4b2b;
      padding: 0.9rem 1.2rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 2px 8px rgba(201, 123, 90, 0.1);
    }

    .validation-message span {
      font-size: 1.4rem;
      line-height: 1;
    }

    .success-toast {
      background: #e6f0e6;
      border-left: 6px solid #5f8b5f;
      color: #2d5a2d;
      padding: 0.9rem 1.2rem;
      border-radius: 1rem;
      font-weight: 500;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .success-toast span {
      font-size: 1.4rem;
    }

    .actions {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-primary {
      background: #4b2e1d;
      color: #fff7f0;
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 18px -6px rgba(75, 46, 29, 0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary:hover:not(:disabled) {
      background: #5f3c28;
      box-shadow: 0 10px 22px -8px rgba(75, 46, 29, 0.45);
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-download {
      background: #5f8b5f;
      color: #fff7f0;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 18px -6px rgba(95, 139, 95, 0.4);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-download:hover:not(:disabled) {
      background: #4f7a4f;
      box-shadow: 0 10px 22px -8px rgba(95, 139, 95, 0.55);
    }

    .btn-download:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-download:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1.5px solid #d9b8a4;
      color: #4b2e1d;
      padding: 0.9rem 1.8rem;
      border-radius: 3rem;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover {
      background: #f5e7de;
      border-color: #b28b74;
    }

    .hidden {
      display: none !important;
    }

    .video-preview-container {
      margin-bottom: 1.8rem;
      border-radius: 1.8rem;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.25);
    }

    .video-preview-container video {
      width: 100%;
      max-height: 260px;
      display: block;
      outline: none;
    }

    .metadata-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      font-size: 0.9rem;
      color: #5e3f2e;
      margin-top: 0.3rem;
    }

    .metadata-row strong {
      font-weight: 600;
      color: #2e1e14;
    }

    .loading-overlay {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #fffaf5;
      border-radius: 1rem;
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      border: 1px dashed #d9b8a4;
      color: #7b5e4b;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .spinner {
      width: 1.1rem;
      height: 1.1rem;
      border: 2.5px solid #e6d6cb;
      border-top-color: #b28b74;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .card {
        padding: 1.8rem 1.3rem;
        border-radius: 2rem;
      }

      h1 {
        font-size: 1.7rem;
      }

      .actions {
        flex-direction: column;
      }

      .btn-primary,
      .btn-download,
      .btn-secondary {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      <span>🧁</span> Vanilla Cupcakes
    </h1>
    <div class="subhead">
      Persistent video · max 30 minutes or 3 GB
    </div>
    <div id="storageIndicator" class="storage-indicator hidden">
      <span>💾</span> <span id="storageIndicatorText">Saved to local storage</span>
    </div>

    <!-- hidden file input (single file only) -->
    <input type="file" id="fileInput" accept="video/*" style="display: none;">

    <!-- drag & drop / click area -->
    <div class="drop-area" id="dropArea">
      <span class="drop-icon">🎬</span>
      <div class="drop-text">Drop your vanilla cupcakes video here</div>
      <div class="drop-hint">or click to browse</div>
      <button class="browse-btn" id="browseBtn" type="button">Choose video</button>
    </div>

    <!-- loading overlay (restoring from storage) -->
    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="spinner"></div>
      <span id="loadingText">Restoring saved video…</span>
    </div>

    <!-- validation error message -->
    <div id="errorBox" class="validation-message hidden">
      <span>⚠️</span>
      <span id="errorText">File is too large or too long.</span>
    </div>

    <!-- success upload message -->
    <div id="successBox" class="success-toast hidden">
      <span>✅</span>
      <span id="successText">Video uploaded successfully!</span>
    </div>

    <!-- selected file info + preview -->
    <div id="fileInfoBox" class="hidden">
      <div class="file-info">
        <div class="file-meta">
          <div class="file-name" id="fileName">video.mp4</div>
          <div class="file-size" id="fileSize">0 MB</div>
          <div class="metadata-row" id="durationRow"></div>
        </div>
        <button class="remove-btn" id="removeFileBtn" type="button">Remove</button>
      </div>

      <!-- video preview -->
      <div class="video-preview-container" id="previewContainer">
        <video id="videoPreview" controls preload="metadata"></video>
      </div>
    </div>

    <!-- action buttons -->
    <div class="actions">
      <button class="btn-secondary" id="clearAllBtn" type="button">Clear</button>
      <button class="btn-download" id="downloadBtn" type="button" disabled>
        <span>⬇️</span> Download
      </button>
      <button class="btn-primary" id="uploadBtn" type="button" disabled>
        <span>📤</span> Upload
      </button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- CONSTRAINTS ----------
      const MAX_SIZE_BYTES = 3 * 1024 * 1024 * 1024; // 3 GB
      const MAX_DURATION_SEC = 30 * 60; // 30 minutes = 1800 sec

      // ---------- IndexedDB SETUP ----------
      const DB_NAME = 'VanillaCupcakesDB';
      const DB_VERSION = 1;
      const STORE_NAME = 'videos';
      const VIDEO_KEY = 'currentVideo';

      let dbPromise = null;

      function openDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error('IndexedDB is not supported in this browser.'));
            return;
          }
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          request.onsuccess = (event) => resolve(event.target.result);
          request.onerror = (event) => reject(event.target.error);
        });
        return dbPromise;
      }

      // Save a Blob/File to IndexedDB along with its metadata
      async function saveVideoToDB(file, duration) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const record = {
            blob: file,
            name: file.name,
            type: file.type,
            size: file.size,
            lastModified: file.lastModified,
            duration: duration,
            savedAt: Date.now()
          };
          const req = store.put(record, VIDEO_KEY);
          req.onsuccess = () => resolve();
          req.onerror = (e) => reject(e.target.error);
        });
      }

      // Load saved video record from IndexedDB
      async function loadVideoFromDB() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(VIDEO_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = (e) => reject(e.target.error);
        });
      }

      // Delete saved video from IndexedDB
      async function deleteVideoFromDB() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const req = store.delete(VIDEO_KEY);
          req.onsuccess = () => resolve();
          req.onerror = (e) => reject(e.target.error);
        });
      }

      // ---------- DOM refs ----------
      const dropArea = document.getElementById('dropArea');
      const fileInput = document.getElementById('fileInput');
      const browseBtn = document.getElementById('browseBtn');

      const storageIndicator = document.getElementById('storageIndicator');
      const storageIndicatorText = document.getElementById('storageIndicatorText');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');

      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');
      const successBox = document.getElementById('successBox');
      const successText = document.getElementById('successText');

      const fileInfoBox = document.getElementById('fileInfoBox');
      const fileNameEl = document.getElementById('fileName');
      const fileSizeEl = document.getElementById('fileSize');
      const durationRow = document.getElementById('durationRow');
      const removeFileBtn = document.getElementById('removeFileBtn');
      const previewContainer = document.getElementById('previewContainer');
      const videoPreview = document.getElementById('videoPreview');

      const uploadBtn = document.getElementById('uploadBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');

      // ---------- STATE ----------
      let currentFile = null;          // File or Blob object
      let currentVideoDuration = null; // in seconds (float)
      let objectUrl = null;            // to revoke
      let isRestoring = false;         // flag to skip auto-save during restore

      // ---------- UTILS ----------
      function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
      }

      function formatDuration(seconds) {
        if (seconds == null || isNaN(seconds)) return '—';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        if (mins >= 60) {
          const hrs = Math.floor(mins / 60);
          const remainingMins = mins % 60;
          return `${hrs}h ${remainingMins}m ${secs}s`;
        }
        return `${mins}m ${secs}s`;
      }

      function hideMessages() {
        errorBox.classList.add('hidden');
        successBox.classList.add('hidden');
      }

      function showError(message) {
        successBox.classList.add('hidden');
        errorText.textContent = message;
        errorBox.classList.remove('hidden');
      }

      function showSuccess(message) {
        errorBox.classList.add('hidden');
        successText.textContent = message;
        successBox.classList.remove('hidden');
        setTimeout(() => {
          successBox.classList.add('hidden');
        }, 4000);
      }

      function setStorageIndicator(state, text) {
        storageIndicator.classList.remove('hidden', 'saving', 'error');
        if (state === 'saving') storageIndicator.classList.add('saving');
        if (state === 'error') storageIndicator.classList.add('error');
        storageIndicatorText.textContent = text || 'Saved to local storage';
      }

      function hideStorageIndicator() {
        storageIndicator.classList.add('hidden');
      }

      function revokeObjectUrl() {
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = null;
        }
      }

      // Reset UI state (does not delete from DB unless explicitly asked)
      function resetFileUI(keepMessages = false) {
        revokeObjectUrl();
        if (!keepMessages) hideMessages();

        currentFile = null;
        currentVideoDuration = null;

        fileInput.value = '';
        fileInfoBox.classList.add('hidden');
        videoPreview.removeAttribute('src');
        videoPreview.load();

        uploadBtn.disabled = true;
        downloadBtn.disabled = true;

        durationRow.innerHTML = '';
        fileNameEl.textContent = '';
        fileSizeEl.textContent = '';
      }

      // Full reset including DB deletion
      async function clearAll(keepMessages = false) {
        resetFileUI(keepMessages);
        hideStorageIndicator();
        try {
          await deleteVideoFromDB();
        } catch (err) {
          console.warn('Could not delete from IndexedDB:', err);
        }
      }

      // ---------- VALIDATION ----------
      function validateFile(file) {
        if (file.size > MAX_SIZE_BYTES) {
          return { valid: false, reason: `File is too large (${formatFileSize(file.size)}). Maximum allowed is 3 GB.` };
        }
        if (!file.type.startsWith('video/')) {
          return { valid: false, reason: 'Only video files are allowed. Please select a video (e.g., MP4, MOV).' };
        }
        return { valid: true, reason: '' };
      }

      // ---------- RENDER FILE (used for both new uploads and restored videos) ----------
      function renderFile(file, duration, options = {}) {
        const { fromStorage = false } = options;

        // set state
        currentFile = file;
        currentVideoDuration = duration;

        // update UI
        fileNameEl.textContent = file.name || 'vanilla-cupcakes-video.mp4';
        fileSizeEl.textContent = formatFileSize(file.size);
        fileInfoBox.classList.remove('hidden');

        const badgeText = fromStorage ? 'persisted' : 'ready';
        const badgeClass = fromStorage ? 'badge persisted' : 'badge';

        durationRow.innerHTML = `
          <span><strong>Duration:</strong> ${formatDuration(duration)}</span>
          <span><strong>Size:</strong> ${formatFileSize(file.size)}</span>
          <span class="${badgeClass}">${badgeText}</span>
        `;

        // create object URL for preview
        revokeObjectUrl();
        objectUrl = URL.createObjectURL(file);
        videoPreview.src = objectUrl;

        // enable buttons
        uploadBtn.disabled = false;
        downloadBtn.disabled = false;

        // show storage indicator if from storage
        if (fromStorage) {
          setStorageIndicator('', 'Loaded from local storage');
        } else {
          hideStorageIndicator();
        }
      }

      // ---------- METADATA + SAVE PIPELINE ----------
      function processNewFile(file) {
        hideMessages();
        hideStorageIndicator();

        const basicCheck = validateFile(file);
        if (!basicCheck.valid) {
          resetFileUI(true);
          showError(basicCheck.reason);
          return;
        }

        // temporarily show file info while we read metadata
        resetFileUI(true);
        fileNameEl.textContent = file.name;
        fileSizeEl.textContent = formatFileSize(file.size);
        fileInfoBox.classList.remove('hidden');

        // use a temporary video element to read duration without disturbing main UI
        const tempVideo = document.createElement('video');
        tempVideo.preload = 'metadata';
        const tempUrl = URL.createObjectURL(file);
        tempVideo.src = tempUrl;

        let finished = false;

        const cleanupTemp = () => {
          URL.revokeObjectURL(tempUrl);
          tempVideo.removeAttribute('src');
          tempVideo.load();
        };

        const onMeta = async () => {
          if (finished) return;
          finished = true;

          const duration = tempVideo.duration;
          cleanupTemp();

          if (isNaN(duration) || duration === Infinity || duration <= 0) {
            resetFileUI(true);
            showError('Could not determine video duration. Please try another file.');
            return;
          }

          if (duration > MAX_DURATION_SEC) {
            resetFileUI(true);
            showError(`Video is too long (${formatDuration(duration)}). Maximum allowed is 30 minutes.`);
            return;
          }

          // All validations passed → render UI
          renderFile(file, duration, { fromStorage: false });

          // Persist to IndexedDB
          setStorageIndicator('saving', 'Saving to local storage…');
          try {
            await saveVideoToDB(file, duration);
            setStorageIndicator('', 'Saved to local storage');
            showSuccess('Video saved and ready.');
          } catch (err) {
            console.error('IndexedDB save error:', err);
            setStorageIndicator('error', 'Could not save to local storage');
            showError('Video is ready but could not be saved persistently (storage error).');
          }
        };

        tempVideo.addEventListener('loadedmetadata', onMeta, { once: true });
        tempVideo.addEventListener('error', () => {
          if (finished) return;
          finished = true;
          cleanupTemp();
          resetFileUI(true);
          showError('Error loading video file. It may be corrupted or unsupported.');
        }, { once: true });

        // timeout safety
        setTimeout(() => {
          if (finished) return;
          finished = true;
          cleanupTemp();
          resetFileUI(true);
          showError('Timed out reading video metadata. Please try another file.');
        }, 8000);
      }

      // ---------- RESTORE FROM INDEXEDDB ON PAGE LOAD ----------
      async function restoreFromStorage() {
        loadingOverlay.classList.remove('hidden');
        loadingText.textContent = 'Restoring saved video…';

        try {
          const record = await loadVideoFromDB();
          if (!record || !record.blob) {
            loadingOverlay.classList.add('hidden');
            return;
          }

          // Validate size/type again in case limits changed
          if (record.size > MAX_SIZE_BYTES) {
            await deleteVideoFromDB();
            loadingOverlay.classList.add('hidden');
            showError('Previously saved video exceeds current size limit and was removed.');
            return;
          }
          if (record.duration && record.duration > MAX_DURATION_SEC) {
            await deleteVideoFromDB();
            loadingOverlay.classList.add('hidden');
            showError('Previously saved video exceeds current duration limit and was removed.');
            return;
          }

          // Reconstruct a File object from stored blob
          const file = new File([record.blob], record.name || 'vanilla-cupcakes-video.mp4', {
            type: record.type || 'video/mp4',
            lastModified: record.lastModified || Date.now()
          });

          // Render UI (mark as persisted)
          renderFile(file, record.duration, { fromStorage: true });
          loadingOverlay.classList.add('hidden');
        } catch (err) {
          console.error('Restore error:', err);
          loadingOverlay.classList.add('hidden');
          setStorageIndicator('error', 'Could not restore saved video');
        }
      }

      // ---------- DOWNLOAD ----------
      function downloadVideo() {
        if (!currentFile) {
          showError('No video selected for download.');
          return;
        }

        if (currentFile.size > MAX_SIZE_BYTES) {
          showError('File exceeds 3 GB limit.');
          return;
        }
        if (currentVideoDuration && currentVideoDuration > MAX_DURATION_SEC) {
          showError('Video exceeds 30 minute limit.');
          return;
        }

        let urlToUse = objectUrl;
        let createdNew = false;
        if (!urlToUse) {
          urlToUse = URL.createObjectURL(currentFile);
          createdNew = true;
        }

        const a = document.createElement('a');
        a.href = urlToUse;
        a.download = (currentFile.name || 'vanilla-cupcakes-video.mp4');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        if (createdNew) {
          setTimeout(() => URL.revokeObjectURL(urlToUse), 5000);
        }

        showSuccess(`Download started for "${currentFile.name}".`);
      }

      // ---------- EVENT LISTENERS ----------
      dropArea.addEventListener('click', (e) => {
        if (e.target === browseBtn) return;
        fileInput.click();
      });

      browseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files.length > 0) {
          processNewFile(files[0]);
        }
        fileInput.value = '';
      });

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
        dropArea.addEventListener(ev, (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });

      dropArea.addEventListener('dragover', () => {
        dropArea.classList.add('dragover');
      });

      dropArea.addEventListener('dragleave', () => {
        dropArea.classList.remove('dragover');
      });

      dropArea.addEventListener('drop', (e) => {
        dropArea.classList.remove('dragover');
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          const file = files[0];
          if (!file.type.startsWith('video/')) {
            showError('Only video files are allowed.');
            return;
          }
          processNewFile(file);
        }
      });

      removeFileBtn.addEventListener('click', async () => {
        await clearAll();
        showSuccess('Video removed from local storage.');
      });

      clearAllBtn.addEventListener('click', async () => {
        await clearAll();
        showSuccess('Everything cleared.');
      });

      uploadBtn.addEventListener('click', () => {
        if (!currentFile) {
          showError('No video selected.');
          return;
        }

        if (currentFile.size > MAX_SIZE_BYTES) {
          showError('File exceeds 3 GB limit.');
          return;
        }
        if (currentVideoDuration && currentVideoDuration > MAX_DURATION_SEC) {
          showError('Video exceeds 30 minute limit.');
          return;
        }

        uploadBtn.disabled = true;
        showSuccess(`"${currentFile.name}" uploaded successfully! (simulated)`);

        const badge = durationRow.querySelector('.badge');
        if (badge) badge.textContent = 'uploaded';
      });

      downloadBtn.addEventListener('click', downloadVideo);

      window.addEventListener('beforeunload', () => {
        revokeObjectUrl();
      });

      // ---------- INIT ----------
      uploadBtn.disabled = true;
      downloadBtn.disabled = true;
      hideMessages();
      restoreFromStorage();
    })();
  </script>
</body>
</html>
